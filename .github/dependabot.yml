version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare-tooling:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
      test-tooling:
        patterns:
          - "vitest"
          - "typescript"
